name: Deploy CaveCode to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish CaveCode
        run: dotnet publish CaveCode.csproj --configuration Release --output publish

      - name: Prepare GitHub Pages files
        run: |
          sed -i 's|<base href="[^"]*" />|<base href="/" />|' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Generate automatic Updates feed
        env:
          UPDATE_LIMIT: "250"
          GITHUB_SHA: ${{ github.sha }}
        run: |
          test -f scripts/generate-updates-json.py
          python3 scripts/generate-updates-json.py > publish/wwwroot/updates.json
          python3 -c "import json;print('entries', len(json.load(open('publish/wwwroot/updates.json'))['updates']))"
          head -n 25 publish/wwwroot/updates.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
